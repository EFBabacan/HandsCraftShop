# HandCraft Shop — Tüm altyapıyı tek komutla ayağa kaldırır:
#   docker compose -f infra/docker-compose.all.yml up -d
# Port planı: Bölüm 3. Tüm servisler handcraft-net ağında.
services:
  # ---------------- Keycloak [#7] ----------------
  keycloak-db:
    image: postgres:16
    container_name: handcraft-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [handcraft-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: handcraft-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on: [keycloak-db, mailhog]
    networks: [handcraft-net]

  # ---------------- Mailhog (sahte SMTP + web UI) — Sifremi Unuttum / Email Verify ----------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: handcraft-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    networks: [handcraft-net]

  # ---------------- MongoDB [#5] ----------------
  mongo:
    image: mongo:7
    container_name: handcraft-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [handcraft-net]

  mongo-express:
    image: mongo-express:1.0
    container_name: handcraft-mongo-express
    # mongo-express baglanti basarisiz olursa cikar; Mongo hazir olana kadar bekle + yeniden dene.
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [handcraft-net]

  # ---------------- Redis [#8] ----------------
  redis:
    image: redis:7
    container_name: handcraft-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [handcraft-net]

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: handcraft-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on: [redis]
    networks: [handcraft-net]

  # ---------------- Indirim PostgreSQL [#6] ----------------
  indirim-db:
    image: postgres:16
    container_name: handcraft-indirim-db
    environment:
      POSTGRES_DB: indirim
      POSTGRES_USER: indirim
      POSTGRES_PASSWORD: indirim
    ports:
      - "5433:5432"
    volumes:
      - indirim-db-data:/var/lib/postgresql/data
    networks: [handcraft-net]

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: handcraft-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@handcraft.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8888:80"
    depends_on: [indirim-db]
    networks: [handcraft-net]

  # ---------------- RabbitMQ [#10] ----------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: handcraft-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [handcraft-net]

  # ---------------- MS SQL Server [#4] ----------------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: handcraft-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "HandCraft!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks: [handcraft-net]

volumes:
  keycloak-db-data:
  mongo-data:
  redis-data:
  indirim-db-data:
  rabbitmq-data:
  mssql-data:

networks:
  handcraft-net:
    name: handcraft-net
