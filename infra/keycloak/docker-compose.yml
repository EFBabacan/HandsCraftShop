# Keycloak 26.4 + kendi PostgreSQL'i (Bölüm 3: Keycloak 8080, KC Postgres 5432)
# Realm: handcraft (realm-export.json import edilir)
services:
  keycloak-db:
    image: postgres:16
    container_name: handcraft-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5432:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - handcraft-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: handcraft-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - keycloak-db
    networks:
      - handcraft-net

volumes:
  keycloak-db-data:

networks:
  handcraft-net:
    name: handcraft-net
